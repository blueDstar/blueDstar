name: Build Doraemon Animation

on:
  workflow_dispatch:

  push:
    paths:
      - "assets/Doraemon.gif"
      - ".github/workflows/build-doraemon.yml"

permissions:
  contents: write

jobs:
  build-doraemon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Doraemon running animation
        run: |
          python << 'PY'
          from PIL import Image, ImageSequence, ImageOps
          import os

          # ==============================
          # FILE PATHS
          # ==============================
          src_path = "assets/Doraemon.gif"
          out_path = "assets/doraemon-run.gif"

          if not os.path.exists(src_path):
              raise FileNotFoundError(
                  f"Cannot find source GIF: {src_path}"
              )

          # ==============================
          # ANIMATION SETTINGS
          # ==============================

          canvas_w = 1200

          # vùng Doraemon chạy
          canvas_h = 150

          # chiều cao Doraemon
          doraemon_h = 125

          # số vị trí khi chạy một chiều
          travel_steps = 45

          # thời gian mỗi frame (ms)
          frame_duration = 130

          # khoảng cách trên
          top_margin = 10

          # khoảng cách 2 mép
          side_margin = 10

          # ==============================
          # LOAD SOURCE GIF
          # ==============================

          source = Image.open(src_path)

          source_frames = []

          for frame in ImageSequence.Iterator(source):
              frame = frame.convert("RGBA")

              ratio = doraemon_h / frame.height

              new_width = int(frame.width * ratio)

              frame = frame.resize(
                  (new_width, doraemon_h),
                  Image.Resampling.LANCZOS
              )

              source_frames.append(frame)

          if len(source_frames) == 0:
              raise RuntimeError("Source GIF contains no frames.")

          sprite_w = source_frames[0].width

          left_x = side_margin
          right_x = canvas_w - sprite_w - side_margin

          # ==============================
          # POSITIONS
          # ==============================

          positions_right = [
              int(
                  left_x +
                  (right_x - left_x) *
                  i /
                  (travel_steps - 1)
              )
              for i in range(travel_steps)
          ]

          # Không lặp lại frame ngoài cùng
          positions_left = list(
              reversed(positions_right[1:-1])
          )

          output_frames = []

          frame_index = 0

          # ==============================
          # LEFT -> RIGHT
          # Doraemon giữ hướng ban đầu
          # ==============================

          for x in positions_right:

              canvas = Image.new(
                  "RGBA",
                  (canvas_w, canvas_h),
                  (0, 0, 0, 0)
              )

              sprite = source_frames[
                  frame_index % len(source_frames)
              ]

              canvas.alpha_composite(
                  sprite,
                  (x, top_margin)
              )

              output_frames.append(canvas)

              frame_index += 1

          # ==============================
          # RIGHT -> LEFT
          # FLIP Doraemon
          # ==============================

          for x in positions_left:

              canvas = Image.new(
                  "RGBA",
                  (canvas_w, canvas_h),
                  (0, 0, 0, 0)
              )

              sprite = source_frames[
                  frame_index % len(source_frames)
              ]

              # FLIP NGANG
              sprite = ImageOps.mirror(sprite)

              canvas.alpha_composite(
                  sprite,
                  (x, top_margin)
              )

              output_frames.append(canvas)

              frame_index += 1

          # ==============================
          # SAVE GIF
          # ==============================

          output_frames[0].save(
              out_path,
              save_all=True,
              append_images=output_frames[1:],
              duration=frame_duration,
              loop=0,
              disposal=2,
              optimize=True
          )

          print("")
          print("================================")
          print("Doraemon animation generated!")
          print("================================")
          print(f"Source : {src_path}")
          print(f"Output : {out_path}")
          print(f"Frames : {len(output_frames)}")
          print("================================")
          PY

      - name: Check generated file
        run: |
          ls -lh assets/
          test -f assets/doraemon-run.gif

      - name: Commit Doraemon animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/doraemon-run.gif

          git diff --cached --quiet || git commit -m "Update Doraemon animation"

          git push
